name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: npm run verify:package

      - uses: actions/upload-artifact@v4
        with:
          name: DDTrans-Setup-${{ github.ref_name }}-x64
          path: release/DDTrans-Setup-*-x64.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $artifacts = @(Get-ChildItem -LiteralPath release -Filter 'DDTrans-Setup-*-x64.exe' -File)
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one Windows setup executable.' }
          $artifact = $artifacts[0].FullName
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $artifact --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $artifact --verify-tag --generate-notes --title "DDTrans $tag" --repo $env:GITHUB_REPOSITORY
          }
